<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⏳ Volvemos pronto | JORDVEX</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: sans-serif;
    }
    body {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      padding: 20px;
    }
    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #ffcc00;
      margin-bottom: 60px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 12px;
    }
    p {
      font-size: 16px;
      color: #b0b0c0;
      margin-bottom: 40px;
    }
    .caja-reloj {
      background: rgba(255, 255, 255, 0.05);
      padding: 40px 50px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    #tiempo {
      font-size: 48px;
      font-weight: bold;
      color: #ffdd44;
      letter-spacing: 3px;
    }
    .etiqueta {
      margin-top: 15px;
      font-size: 14px;
      color: #888899;
    }
    .volver {
      margin-top: 40px;
    }
    .volver a {
      color: #ffcc00;
      text-decoration: none;
      font-size: 16px;
    }
    .volver a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="logo">✦ JORDVEX</div>
  
  <div class="caja-reloj">
    <h1>⏳ Volvemos pronto</h1>
    <p>Estamos preparando algo increíble. ¡Vuelve en:</p>
    <div id="tiempo">02:22:00</div>
    <div class="etiqueta">Tiempo restante</div>
  </div>
  
  <div class="volver">
    <a href="index.html">← Ir al inicio</a>
  </div>

  <script>
    let tiempoRestante = 2 * 60 * 60 + 22 * 60;
    
    function actualizarReloj() {
      const horas = Math.floor(tiempoRestante / 3600);
      const minutos = Math.floor((tiempoRestante % 3600) / 60);
      const segundos = tiempoRestante % 60;
      
      const formato =
        String(horas).padStart(2, '0') + ':' +
        String(minutos).padStart(2, '0') + ':' +
        String(segundos).padStart(2, '0');
      
      document.getElementById('tiempo').textContent = formato;
      
      if (tiempoRestante > 0) {
        tiempoRestante--;
      } else {
        document.getElementById('tiempo').textContent = '¡YA ESTAMOS AQUÍ! 🎉';
      }
    }
    
    setInterval(actualizarReloj, 1000);
    actualizarReloj();
  </script>
</body>
</html>
