<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⏳ Volvemos pronto | JORDVEX</title>
  <meta name="theme-color" content="#0d0c15">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
    }
    body {
      min-height: 100dvh;
      background:
        radial-gradient(900px 420px at 50% -120px, rgba(255, 143, 184, 0.13), transparent 70%),
        #0d0c15;
      color: #ede9fa;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 20px;
    }
    .logo {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ff8fb8;
      margin-bottom: 48px;
    }
    .caja {
      width: min(100%, 380px);
      background: linear-gradient(180deg, #1e1b2d 0%, #151320 100%);
      border: 1px solid #2d2a42;
      border-radius: 22px;
      padding: 36px 28px;
      box-shadow: 0 28px 50px -34px #000;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }
    .mensaje {
      font-size: 15px;
      color: #9a95b4;
      margin-bottom: 28px;
      line-height: 1.45;
    }
    #tiempo {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #ff8fb8;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 24px rgba(255, 143, 184, 0.35);
    }
    .etiqueta {
      margin-top: 12px;
      font-size: 13px;
      color: #9a95b4;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .volver {
      margin-top: 36px;
    }
    .volver a {
      color: #8f82ff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
    }
    .volver a:hover {
      text-decoration: underline;
    }
    .listo {
      color: #5fd6a8;
      font-size: 22px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="logo">✦ JORDVEX</div>

  <div class="caja">
    <h1>⏳ Volvemos pronto</h1>
    <p class="mensaje" id="mensaje">Estamos preparando algo increíble. ¡Vuelve en:</p>
    <div id="tiempo">--:--:--</div>
    <div class="etiqueta" id="etiqueta">Tiempo restante</div>
  </div>

  <div class="volver">
    <a href="/">← Ir al inicio</a>
  </div>

  <script>
    // Hora objetivo: hoy a las 12:49 (hora local del dispositivo)
    const ahora = new Date();
    const objetivo = new Date(
      ahora.getFullYear(),
      ahora.getMonth(),
      ahora.getDate(),
      12,  // hora
      49,  // minutos
      0    // segundos
    );

    function actualizar() {
      const restante = objetivo - Date.now();

      if (restante <= 0) {
        document.getElementById('tiempo').textContent = '¡YA ESTAMOS AQUÍ!';
        document.getElementById('tiempo').className = 'listo';
        document.getElementById('mensaje').textContent = 'El sitio ya está disponible.';
        document.getElementById('etiqueta').textContent = 'Puedes entrar';
        return;
      }

      const totalSeg = Math.floor(restante / 1000);
      const horas = Math.floor(totalSeg / 3600);
      const minutos = Math.floor((totalSeg % 3600) / 60);
      const segundos = totalSeg % 60;

      const formato =
        String(horas).padStart(2, '0') + ':' +
        String(minutos).padStart(2, '0') + ':' +
        String(segundos).padStart(2, '0');

      document.getElementById('tiempo').textContent = formato;
    }

    actualizar();
    setInterval(actualizar, 1000);
  </script>
</body>
</html>
